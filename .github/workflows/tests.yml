name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest on Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: coopetition_gym/pyproject.toml

      - name: Install package with test dependencies
        working-directory: coopetition_gym
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,experiments]"

      - name: Run pytest
        working-directory: coopetition_gym
        run: python -m pytest coopetition_gym/tests/ experiments/tests/ -v --tb=short

      - name: Test optional extension without training
        if: matrix.python-version != '3.9'
        working-directory: coopetition_gym
        run: python -m pytest extensions/slcd_2d/tests/ -k "not test_ippo_trains_on_2d" -v --tb=short
