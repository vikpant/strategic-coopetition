name: Install Verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  install:
    name: Install on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package from source
        working-directory: coopetition_gym
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify imports and environment registration
        run: |
          python -c "import coopetition_gym; print('coopetition_gym version:', coopetition_gym.__version__ if hasattr(coopetition_gym, '__version__') else 'installed')"
          python -c "import coopetition_gym; envs = coopetition_gym.list_environments(); print(f'Registered {len(envs)} environments'); assert len(envs) >= 20, f'Expected >=20 environments, found {len(envs)}'"

      - name: Verify Gymnasium API
        run: |
          python - <<'PY'
          import coopetition_gym
          env = coopetition_gym.make("TrustDilemma-v0")
          obs, info = env.reset(seed=42)
          for _ in range(5):
              obs, reward, terminated, truncated, info = env.step([50.0, 50.0])
              if terminated or truncated:
                  break
          env.close()
          print("Gymnasium API: OK")
          PY

      - name: Verify PettingZoo Parallel API
        run: |
          python - <<'PY'
          import coopetition_gym
          env = coopetition_gym.make_parallel("TrustDilemma-v0")
          obs, info = env.reset(seed=42)
          for _ in range(5):
              actions = {agent: 50.0 for agent in env.agents}
              obs, rewards, terminations, truncations, infos = env.step(actions)
              if not env.agents:
                  break
          env.close()
          print("PettingZoo Parallel API: OK")
          PY
