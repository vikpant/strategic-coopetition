name: Install Verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  install:
    name: Install on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.12']

    # Use bash on every runner so the heredoc syntax below works on Windows
    # too (Windows GitHub runners default to PowerShell otherwise).
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install wheels
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip wheel --no-deps --wheel-dir dist ./coopetition_gym ./coopetition_gym/extensions/slcd_2d
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess, sys
          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 2
          args = [str(p) + ("[experiments]" if p.name.startswith("coopetition_gym-") else "") for p in wheels]
          subprocess.run([sys.executable, "-m", "pip", "install", *args], check=True)
          PYCODE

      - name: Verify installed APIs and reproduction commands outside checkout
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: python "$GITHUB_WORKSPACE/.github/scripts/verify_installation.py" "$GITHUB_WORKSPACE"
